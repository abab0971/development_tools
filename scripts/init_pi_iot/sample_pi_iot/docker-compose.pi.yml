name: __PROJ_NAME_LOWER__

services:
  # 樹莓派 Python 開發環境 (IoT Core 背景迴圈節點)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - /opt/__PROJ_NAME_LOWER__/data:/workspace/data  # 強制綁定實體外部數據護城河路徑
    network_mode: host
    privileged: true                  # 實機：給予實體硬體最高控制權限
    devices:
      - "/dev/gpiomem:/dev/gpiomem"  # 實機：硬體 GPIO 權限
      - "/dev/i2c-1:/dev/i2c-1"      # 實機：硬體 I2C 權限
      - "/dev/ttyAMA0:/dev/ttyAMA0"  # 實機：硬體 UART 權限
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - MOCK_HARDWARE=false             # 在樹莓派上強制關閉 Mock，啟用實體硬體
      - TZ=Asia/Taipei                  # 設定時區為台北
      - MQTT_BROKER=mosquitto
      - DB_TYPE=sqlite                # 讓程式知道目前使用 SQLite
      - DB_PATH=/workspace/data/pi.db # 指定 SQLite 檔案路徑
    depends_on:
      - mosquitto

  # 輕量化 MQTT Broker (預留)
  mosquitto:
    image: eclipse-mosquitto:latest
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log: